name: Acquire License
on: workflow_dispatch

jobs:
  acquire:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '18'
      - run: npm install --global unity-license-activate
      - name: Request .alf
        id: getAlf
        uses: game-ci/unity-request-activation-file@v2
        with:
          unityVersion: '6000.0.69f1'
      - name: Activate
        run: unity-license-activate "${{ secrets.UNITY_EMAIL }}" "${{ secrets.UNITY_PASSWORD }}" "${{ steps.getAlf.outputs.filePath }}"
      - name: Upload .ulf artifact
        uses: actions/upload-artifact@v4
        with:
          name: unity-license
          path: ${{ env.ULF_FILE }}
