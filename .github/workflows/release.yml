name: Build Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress -y

      - name: Setup Unity
        uses: game-ci/unity-setup@v2
        with:
          unity-version: '6000.0.69f1'
          build-targets: 'StandaloneWindows64'

      - name: Activate Unity license
        uses: buildalon/activate-unity-license@v2
        with:
          license: 'Personal'
          username: ${{ secrets.UNITY_EMAIL }}
          password: ${{ secrets.UNITY_PASSWORD }}

      - name: Build CoNNect-Four
        uses: game-ci/unity-builder@v2
        with:
          targetPlatform: Windows64

      - name: Build installer
        shell: pwsh
        run: |
          $Version = "${{ github.ref_name }}".TrimStart("v")

          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" `
            "/DGameVersion=$Version" `
            "/DBuildDir=$env:GITHUB_WORKSPACE\build\StandaloneWindows64" `
            "$env:GITHUB_WORKSPACE\installer\CoNNect-Four.iss"

      - name: Upload release package
        uses: actions/upload-artifact@v4
        with:
          name: CoNNect-Four
          path: installer/output/CoNNect-Four-${{ github.ref_name }}.exe

  release:
    needs: build
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Download release package
        uses: actions/download-artifact@v4
        with:
          path: release

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: CoNNect-Four ${{ github.ref_name }}
          generate_release_notes: false
          files: release/**/CoNNect-Four-${{ github.ref_name }}.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Push to Itch.io
        uses: yeslayla/butler-publish-itchio-action@master
        env:
          BUTLER_CREDENTIALS: ${{ secrets.BUTLER_API_KEY }}
          CHANNEL: windows
          ITCH_GAME: connect-four
          ITCH_USER: flyingarthur
          PACKAGE: release/**/CoNNect-Four-${{ github.ref_name }}.exe
          VERSION: ${{ github.ref_name }}
